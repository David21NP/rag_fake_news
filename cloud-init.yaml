#cloud-config

# ─── Usuario ────────────────────────────────────────────────────────────────
users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIkX6NNAm0DJhxBKkCm5nmpLYIlZKkA939UF8Ebo8/9H david@archlinux

# ─── Acceso root por SSH deshabilitado ──────────────────────────────────────
disable_root: true

# ─── Paquetes base ──────────────────────────────────────────────────────────
package_update: true
package_upgrade: true
packages:
  - curl
  - git
  - ufw
  - fail2ban
  - ca-certificates
  - gnupg
  - lsb-release

# ─── Hardening SSH + fail2ban ────────────────────────────────────────────────
write_files:
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      Port 2222
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      AllowTcpForwarding no
      X11Forwarding no
      AllowAgentForwarding no
      AuthorizedKeysFile .ssh/authorized_keys
      AllowUsers deploy

  - path: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled = true
      port = 2222
      maxretry = 3
      bantime = 1h

# ─── Comandos de instalación ────────────────────────────────────────────────
runcmd:
  # Docker oficial
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Swap 2 GB
  - fallocate -l 6G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Firewall — SSH en puerto 2222
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 2222/tcp
  - ufw allow 8000/tcp
  - ufw --force enable

  # Reboot para aplicar actualizaciones del kernel
  - reboot
